name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Prüfe diesen Pull Request als Code-Reviewer des Projekts. Maßgeblich sind .claude/CLAUDE.md,
            die zu den geänderten Dateien passenden Regeln in .claude/rules/ und die Checkliste in
            .claude/agents/reviewer.md. Verifiziere jeden Befund im Code, bevor du ihn meldest.

            Konkrete Probleme als Inline-Kommentare an der betroffenen Zeile, mit Vorschlag zur Behebung.
            Zum Schluss ein kurzer Gesamtkommentar: Befunde nach Schwere oder „Keine Befunde“.
            Schreibe auf Deutsch.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
